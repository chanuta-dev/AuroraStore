name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'סוג הגרסה לבנייה'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - prerelease # גרסת ניסוי (Pre-release)
          - release    # שחרור רשמי (Production Release)

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      # קביעת מספרי הגרסאות לפני הבנייה
      - name: Determine Version & Release Info
        id: versioning
        run: |
          RUN_ID="${{ github.run_number }}"
          V_CODE=$((1000 + RUN_ID))
          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT

          if [ "${{ github.event.inputs.release_type }}" == "release" ]; then
            V_NAME="5.0.${RUN_ID}"
            echo "version_name=$V_NAME" >> $GITHUB_OUTPUT
            echo "tag_name=v${V_NAME}" >> $GITHUB_OUTPUT
            echo "release_name=Release v${V_NAME}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            V_NAME="5.0.${RUN_ID}-beta"
            echo "version_name=$V_NAME" >> $GITHUB_OUTPUT
            echo "tag_name=v${V_NAME}" >> $GITHUB_OUTPUT
            echo "release_name=Beta/Experimental v${V_NAME}" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew GooglePlayAPI/gradlew || true

      # הזרקת הגרסאות לתוך ה-APK בעת הבנייה
      - name: Build with Gradle
        env:
          APP_VERSION_NAME: ${{ steps.versioning.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.versioning.outputs.version_code }}
        run: ./gradlew assembleVanillaRelease --build-cache --parallel --stacktrace

      # חתימה על ה-APK עם המפתח מה-Secrets
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
        with:
          releaseDirectory: app/build/outputs/apk/vanilla/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # יצירת ה-Release ב-GitHub
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: ${{ steps.versioning.outputs.release_name }}
          prerelease: ${{ steps.versioning.outputs.is_prerelease == 'true' }}
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
