name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'סוג הגרסה לבנייה'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - prerelease # גרסת ניסוי (Pre-release)
          - release    # שחרור רשמי (Production Release)

# מתן הרשאות ליצירת Releases ותגיות באופן אוטומטי
permissions:
  contents: write

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew GooglePlayAPI/gradlew || true

      - name: Build with Gradle
        run: ./gradlew assembleVanillaRelease --build-cache --parallel --stacktrace

      # חתימה על ה-APK עם המפתח מה-Secrets
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/vanilla/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # קביעת שם הגרסה והגדרות הריליס באופן אוטומטי
      - name: Determine Version & Release Info
        id: versioning
        run: |
          RUN_ID="${{ github.run_number }}"
          if [ "${{ github.event.inputs.release_type }}" == "release" ]; then
            echo "tag_name=v1.0.${RUN_ID}" >> $GITHUB_OUTPUT
            echo "release_name=Release v1.0.${RUN_ID}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v1.0.${RUN_ID}-beta" >> $GITHUB_OUTPUT
            echo "release_name=Beta/Experimental v1.0.${RUN_ID}" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      # יצירת ה-Release האוטומטי (יוצר גם את התגית בעצמו)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: ${{ steps.versioning.outputs.release_name }}
          prerelease: ${{ steps.versioning.outputs.is_prerelease == 'true' }}
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
