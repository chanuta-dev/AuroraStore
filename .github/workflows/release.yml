name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      # 1. מוריד רק את הקוד העדכני ביותר (חוסך זמן והורדה)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. שומר את כל ההורדות וה-Dependencies במטמון לריצות הבאות
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew GooglePlayAPI/gradlew || true

      # 3. בנייה עם דגלי ביצועים ו-Build Cache
      - name: Build with Gradle
        run: ./gradlew assembleVanillaRelease --build-cache --parallel --stacktrace

      # 4. חתימה על ה-APK באמצעות המפתח שלך מה-Secrets
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/vanilla/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # 5. שמירת ה-APK החתום כ-Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraStore-Signed-APK
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      # 6. יצירת Release אם הופעל בעזרת Tag
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
