name: Auto Update AI Changes and Tree

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'AI_CHANGES.md'
      - 'PROJECT_TREE.md'
      - '.github/**'

permissions:
  contents: write

jobs:
  track-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # שלב 1: מעקב אחר השינוי האחרון
      - name: Generate AI Diff
        run: |
          CURRENT_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "## 📅 עדכון: $CURRENT_DATE" > new_entry.tmp
          echo "**הודעת קומיט:** ${{ github.event.head_commit.message }}" >> new_entry.tmp
          echo "**קוד שינוי:** \`${{ github.sha }}\`" >> new_entry.tmp
          echo "" >> new_entry.tmp
          echo "### 📂 קבצים שהושפעו:" >> new_entry.tmp
          git diff --name-status HEAD~1 HEAD >> new_entry.tmp
          echo "" >> new_entry.tmp
          echo "### 📝 פירוט השינויים (Diff):" >> new_entry.tmp
          echo '```diff' >> new_entry.tmp
          git diff HEAD~1 HEAD >> new_entry.tmp
          echo '```' >> new_entry.tmp
          echo -e "\n---\n" >> new_entry.tmp

          if [ -f AI_CHANGES.md ]; then
            cat new_entry.tmp AI_CHANGES.md > combined.tmp
            mv combined.tmp AI_CHANGES.md
            rm -f new_entry.tmp
          else
            mv new_entry.tmp AI_CHANGES.md
          fi

      # שלב 2: יצירת עץ מבנה הפרויקט המלא
      - name: Generate Project Tree
        run: |
          sudo apt-get update && sudo apt-get install -y tree

          echo "# 🌳 מבנה עץ הפרויקט (Project Tree)" > PROJECT_TREE.md
          echo "> מתעדכן אוטומטית בכל שינוי עבור AI Context." >> PROJECT_TREE.md
          echo "" >> PROJECT_TREE.md
          echo '```text' >> PROJECT_TREE.md
          # מסננים קבצי מערכת ותרגומים כבדים שלא רלוונטיים ל-AI
          tree -a -I ".git|.gradle|build|.idea|changelogs" --dirsfirst >> PROJECT_TREE.md
          echo '```' >> PROJECT_TREE.md

      # שלב 3: שמירה ודחיפה של שני הקבצים
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add AI_CHANGES.md PROJECT_TREE.md
          git commit -m "docs: auto-update AI_CHANGES & PROJECT_TREE [skip ci]" || exit 0
          git push
