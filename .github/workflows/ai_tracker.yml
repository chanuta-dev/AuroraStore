name: Auto Update AI Changes

on:
  push:
    branches:
      - main # שים לב: אם הענף הראשי שלך נקרא main, שנה כאן ל-main
    paths-ignore:
      - 'AI_CHANGES.md'
      - '.github/**'

permissions:
  contents: write

jobs:
  track-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # מאפשר לראות את השינוי ביחס לגרסה הקודמת

      - name: Generate AI Diff
        run: |
          CURRENT_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          # יצירת מקטע השינוי הנוכחי עם תאריך תקין
          echo "## 📅 עדכון: $CURRENT_DATE" > new_entry.tmp
          echo "**הודעת קומיט:** ${{ github.event.head_commit.message }}" >> new_entry.tmp
          echo "**קוד שינוי:** \`${{ github.sha }}\`" >> new_entry.tmp
          echo "" >> new_entry.tmp
          echo "### 📂 קבצים שהושפעו:" >> new_entry.tmp
          git diff --name-status HEAD~1 HEAD >> new_entry.tmp
          echo "" >> new_entry.tmp
          echo "### 📝 פירוט השינויים (Diff):" >> new_entry.tmp
          echo '```diff' >> new_entry.tmp
          git diff HEAD~1 HEAD >> new_entry.tmp
          echo '```' >> new_entry.tmp
          echo -e "\n---\n" >> new_entry.tmp

          # שרשור השינוי החדש לראש הקובץ הקיים (החדש ביותר תמיד למעלה)
          if [ -f AI_CHANGES.md ]; then
            cat new_entry.tmp AI_CHANGES.md > combined.tmp
            mv combined.tmp AI_CHANGES.md
            rm -f new_entry.tmp
          else
            mv new_entry.tmp AI_CHANGES.md
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add AI_CHANGES.md
          git commit -m "docs: update AI_CHANGES.md [skip ci]" || exit 0
          git push
